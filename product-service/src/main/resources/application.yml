spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tokoku
    username: product_user
    password: product_pw
  jpa:
    open-in-view: false
  mvc:
    apiversion:
      use:
        header: API-Version
      supported: 1, 2
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto

server:
  port: 8081

management:
  # Ekspor OTLP ke grafana/otel-lgtm (compose profil obs). Scaffolding L8.1-B, dibahas di Modul 20.
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health, info, env, configprops

tokoku:
  inventory:
    base-url: http://localhost:8083
    read-timeout: 2s
