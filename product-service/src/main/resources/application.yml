spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tokoku
    username: product_user
    password: product_pw
  jpa:
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto

server:
  port: 8081

management:
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health, info, env, configprops

tokoku:
  inventory:
    base-url: http://localhost:8083
    read-timeout: 2s
