apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      # > preStop 10 s + timeout shutdown Spring 30 s (slide 157-158); lewat dari ini SIGKILL.
      terminationGracePeriodSeconds: 45
      containers:
        - name: product-service
          # Image lokal: Docker Desktop (mode kubeadm) memakai image store yang sama dengan docker build.
          image: product-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: product-service
          lifecycle:
            # Beri waktu endpoint keluar dari Service/load balancer sebelum SIGTERM (K8s 1.30+).
            preStop:
              sleep:
                seconds: 10
          # Startup: beri waktu Spring start tanpa membuat liveness agresif.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 2
            failureThreshold: 60
          # Liveness: proses sehat? TANPA dependency eksternal (DB mati tidak boleh memicu restart).
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: siap menerima traffic? Termasuk DB (grup readiness diatur di ConfigMap).
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: db-secret
              mountPath: /etc/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: db-secret
          secret:
            secretName: product-db
        # readOnlyRootFilesystem: JVM dan Tomcat butuh /tmp yang bisa ditulis.
        - name: tmp
          emptyDir: {}
