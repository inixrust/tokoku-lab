apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      # TODO L21.1: terminationGracePeriodSeconds > preStop + timeout shutdown Spring (slide 157-158).
      containers:
        - name: product-service
          # Image lokal: Docker Desktop (mode kubeadm) memakai image store yang sama dengan docker build.
          image: product-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: product-service
          # TODO L21.1: lifecycle.preStop, livenessProbe, readinessProbe (slide 158).
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: db-secret
              mountPath: /etc/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: db-secret
          secret:
            secretName: product-db
        # readOnlyRootFilesystem: JVM dan Tomcat butuh /tmp yang bisa ditulis.
        - name: tmp
          emptyDir: {}
