# Infrastruktur TokoKu. Nyalakan per hari sesuai profil (rencana §3.4), contoh:
#   docker compose -f infra/compose.yaml --profile db up -d
name: tokoku

services:
  postgres:
    image: postgres:17-alpine
    profiles: [db]
    environment:
      POSTGRES_DB: tokoku
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./postgres/reset.sql:/tokoku/reset.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tokoku"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka KRaft single node. Dua listener (rencana §6 L7.1):
  #   aplikasi di host (mode dev)        -> localhost:9092
  #   aplikasi di container (mode perf)  -> kafka:29092
  kafka:
    image: apache/kafka:4.2.2
    profiles: [kafka]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # OTel Collector + Prometheus + Tempo + Loki + Grafana dalam satu container.
  # Grafana: http://localhost:3000 (admin/admin). OTLP: 4317 (gRPC), 4318 (HTTP).
  lgtm:
    image: grafana/otel-lgtm:0.39.0
    profiles: [obs]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/tokoku.yaml:ro
      - ./grafana/dashboards:/tokoku/dashboards:ro

  # Chaos: proxy di depan inventory-service (yang jalan di host). Atur toxic lewat API 8474,
  # mis. scripts/chaos.ps1 -Latency 3000
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    profiles: [chaos]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "8474:8474"
      - "18083:18083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro

  # Keycloak (realm tokoku diimpor otomatis). Admin console: http://localhost:8180 (admin/admin).
  # KC_HOSTNAME membuat claim iss selalu http://localhost:8180/realms/tokoku, juga saat diakses dari container
  # (mode perf memakai jwk-set-uri internal http://keycloak:8080/...).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    profiles: [security]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-tokoku.json:/opt/keycloak/data/import/realm-tokoku.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  pgdata:
