# Infrastruktur TokoKu. Nyalakan per hari sesuai profil (rencana §3.4), contoh:
#   docker compose -f infra/compose.yaml --profile db up -d
name: tokoku

services:
  postgres:
    image: postgres:17-alpine
    profiles: [db]
    environment:
      POSTGRES_DB: tokoku
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./postgres/reset.sql:/tokoku/reset.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tokoku"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
