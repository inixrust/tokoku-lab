spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tokoku
    username: order_user
    password: order_pw
  jpa:
    open-in-view: false
    properties:
      hibernate.generate_statistics: true
  http:
    clients:
      # Connect pendek (fail fast), read sesuai latency downstream (slide 51).
      connect-timeout: 2s
      read-timeout: 5s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto

server:
  port: 8082

management:
  # Ekspor OTLP ke grafana/otel-lgtm (compose profil obs). Scaffolding L8.1-B, dibahas di Modul 20.
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  server:
    port: 9082
  # Ekspos seperlunya, jangan "*" (slide 68). Management port terpisah dari port aplikasi.
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized

tokoku:
  inventory:
    # Nama service di Eureka, bukan host:port. Spring Cloud LoadBalancer memilih instance.
    base-url: http://inventory-service

logging:
  level:
    # Hibernate 7: ringkasan "Session Metrics" (jumlah JDBC statement) ditulis di level DEBUG.
    org.hibernate.session.metrics: debug

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    registry-fetch-interval-seconds: 5
  instance:
    # Dua instance di host yang sama butuh instance-id berbeda.
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    # Lab: heartbeat cepat agar instance mati segera dikeluarkan (default 30 s / 90 s).
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
