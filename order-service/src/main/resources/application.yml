spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tokoku
    username: order_user
    password: order_pw
  jpa:
    open-in-view: false
    properties:
      hibernate.generate_statistics: true
  http:
    clients:
      # Connect pendek (fail fast), read sesuai latency downstream (slide 51).
      connect-timeout: 2s
      read-timeout: 5s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto

server:
  port: 8082

management:
  # Ekspor OTLP ke grafana/otel-lgtm (compose profil obs). Scaffolding L8.1-B, dibahas di Modul 20.
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  server:
    port: 9082
  endpoints:
    web:
      exposure:
        include: health, info

tokoku:
  inventory:
    base-url: http://localhost:8083

logging:
  level:
    # Hibernate 7: ringkasan "Session Metrics" (jumlah JDBC statement) ditulis di level DEBUG.
    org.hibernate.session.metrics: debug
